<!DOCTYPE html>
<html lang="ja">
<head>
    <title>Stone Trader Game Desu</title>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/idb@7/build/umd.js"></script>
    <link rel="stylesheet" href="mitame.css">
</head>
<body>

    
    <div id="logOutput" class="draggable">
        <div class="logs"></div>
        <div class="row">
            <textarea></textarea>
            <div class="bt">➡︎</div>
        </div>
    </div>
    <div id="mobileDesc"></div>
    <div id="log" class="hid">
        <div class="opener"><</div>
        <div class="main"></div>
        <div class="text"></div>
    </div>
    <div id="tenshee">
        <div class="disp"></div>
        <div class="bts">
            <div class="bt num" data-num="1">1</div>  <div class="bt num" data-num="2">2</div> <div class="bt num" data-num="3">3</div>
            <div class="bt num" data-num="4">4</div>  <div class="bt num" data-num="5">5</div> <div class="bt num" data-num="6">6</div>
            <div class="bt num" data-num="7">7</div>  <div class="bt num" data-num="8">8</div> <div class="bt num" data-num="9">9</div>
            <div class="bt del">←</div> <div class="bt num" data-num="0">0</div> <div class="bt ok">OK</div>
        </div>
    </div>
    <div id="movlis">
        <div class="title">Move List</div>
        <div class="list"></div>
    </div>
    

    <div id="main">

        <div id="upper">
            <div class="stat">
                <div class="st rimi">
                    <img src="assets/images/items/rimi.png">
                    <div class="num">#0</div>
                </div>
                <div class="st nani">
                    <img src="assets/images/systems/error.png">
                    <div class="num">Err0R!</div>
                </div>
            </div>
            <div class="areaName">---</div>
            <div class="back"></div>
        </div>

        <div id="loby" class="space show">
            <div class="grid"></div>
        </div>

        <div id="shichi" class="space">
            <div class="back"></div>
            <div class="owner">
                <div class="chara"><img src="assets/images/npcs/buyer.png"></div>
                <div class="text"></div>
            </div>
            <div class="terner"></div>
        </div>

        <div id="mine" class="space">
            <div class="vein"></div>
        </div>

        <div id="shop" class="area">
            <div class="text">
                ここは店だぜ<br>
                夢で友達に、「マリカで今ここが流行ってる」<br>
                って言われたのが"セイムマート"ってステージで<br>
                そのまま流用してここの名前はセイムマートなのだぜ
            </div>
        </div>

        <div id="still" class="area">
            <div class="text">
                ここはまだ何もできてないとこだよ<br>
                わかったらさっさと帰んな
            </div>
        </div>
        
        <div id="debug" class="draggable">
            <div class="stat">
                <div class="rimi">#1000</div>
            </div>
            <div class="data"></div>
            <div class="menu"></div>
        </div>
        <div id="home" class="space"></div>


    </div>



    <script>
        (async() => {
            let ts = new Date().getTime(); 

            let ZettaiTukawarenaiKannsuu = async (f) => {
                return new Promise(res => {
                    let script = document.createElement('script');
                    script.src = `${f}.js?v=${ts}`;
                    script.defer = true;
                    script.onload = res;
                    document.head.appendChild(script);
                });        
            }
            await ZettaiTukawarenaiKannsuu("data");
            await ZettaiTukawarenaiKannsuu("komagome");
            await ZettaiTukawarenaiKannsuu("nakami");
        })();
    </script>
</body>
</html>
